version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads *.up.sql here and ignores *.down.sql (golang-migrate naming).
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "chatdb"
        out: "internal/chat/chatdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # Postgres uuid columns scan cleanly into Go strings with pgx v5,
          # and the domain layer uses strings throughout.
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
